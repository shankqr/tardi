name: "Deploy: Backend"

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: api

jobs:
  build-push-deploy:
    name: Build, Push & Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tardi

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_TAG="prod-${SHA_SHORT}"
            CONVENIENCE_TAG="stable"
            CLOUD_RUN_SERVICE="tardi-api-prod"
          else
            ENV_TAG="dev-${SHA_SHORT}"
            CONVENIENCE_TAG="latest"
            CLOUD_RUN_SERVICE="tardi-api-dev"
          fi
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "convenience_tag=${CONVENIENCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "cloud_run_service=${CLOUD_RUN_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.env_tag }}
            ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.convenience_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.tags.outputs.cloud_run_service }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.env_tag }}
          revision_traffic: LATEST=100
