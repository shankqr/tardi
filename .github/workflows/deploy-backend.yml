name: "Deploy: Backend"

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: api

jobs:
  build-push-deploy:
    name: Build, Push & Deploy to ${{ github.ref_name == 'main' && 'Production' || 'Dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tardi

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_TAG="prod-${SHA_SHORT}"
            CONVENIENCE_TAG="latest"
            CLOUD_RUN_SERVICE="tardi-api-prod"
          else
            ENV_TAG="dev-${SHA_SHORT}"
            CONVENIENCE_TAG="latest"
            CLOUD_RUN_SERVICE="tardi-api-dev"
          fi
          echo "env_tag=${ENV_TAG}" >> "$GITHUB_OUTPUT"
          echo "convenience_tag=${CONVENIENCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "cloud_run_service=${CLOUD_RUN_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.env_tag }}
            ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.convenience_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.tags.outputs.cloud_run_service }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.env_tag }}
          revision_traffic: LATEST=100
          flags: --timeout=900

      - name: Verify deployment health
        if: success()
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ steps.tags.outputs.cloud_run_service }} \
            --region=${{ secrets.GCP_REGION }} \
            --format='value(status.url)')
          echo "Service URL: ${SERVICE_URL}"

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/readyz_body -w '%{http_code}' "${SERVICE_URL}/readyz" || echo "000")
            BODY=$(cat /tmp/readyz_body 2>/dev/null || echo "no response")
            echo "Attempt ${i}: HTTP ${HTTP_CODE} - ${BODY}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Deployment verified healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployment smoke test failed after 5 attempts. Last response: HTTP ${HTTP_CODE} - ${BODY}"
          exit 1

      - name: Notify deploy failure
        if: failure() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `PROD DEPLOY FAILED: ${context.sha.substring(0, 7)}`;
            const body = [
              `## Production Backend Deploy Failed`,
              ``,
              `**Commit:** \`${context.sha}\``,
              `**Branch:** \`${context.ref}\``,
              `**Image:** \`${{ steps.tags.outputs.full_image }}:${{ steps.tags.outputs.env_tag }}\``,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Check the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the exact error.`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deploy-failure'],
              assignees: [context.actor],
            });
