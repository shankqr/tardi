name: "Synthetic Monitoring"

# Health checks (curl + SSL) now run on Cloud Scheduler → Cloud Run Job
# (see infra/modules/backend-env/synthetic_monitor.tf). This workflow
# only keeps the Playwright deep check, at a reduced hourly cadence.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deep-checks:
    name: Deep Checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium only)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests against production
        working-directory: frontend
        run: npx playwright test --project=smoke
        env:
          E2E_BASE_URL: https://app.tardi.ai
