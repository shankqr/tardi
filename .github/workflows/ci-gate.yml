name: "CI Gate"

on:
  pull_request:
    branches: [dev, main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  infra:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  gate:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend, backend, infra]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.infra.result }}" = "failure" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All required checks passed"
